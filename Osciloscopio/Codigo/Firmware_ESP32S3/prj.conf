# Osciloscopio ESP32-S3 - configuracion Zephyr

# Consola (se redirige al USB-Serial-JTAG en boards/*.overlay)
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# ADC con DMA (rafagas con intervalo constante entre conversiones)
CONFIG_ADC=y
CONFIG_ADC_ESP32_DMA=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# SPI en modo esclavo (target)
CONFIG_SPI=y
CONFIG_SPI_ESP32_INTERRUPT=y
CONFIG_ESP32_SPI_TARGET=y

# CRC-16 (CRC-16/CCITT-FALSE = crc16_itu_t con semilla 0xFFFF)
CONFIG_CRC=y

# Resolucion del tick: 100 us (necesario para el preset de 100 Sa/s)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_MAIN_STACK_SIZE=2048

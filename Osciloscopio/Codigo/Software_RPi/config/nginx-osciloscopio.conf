# /etc/nginx/sites-available/osciloscopio  (enlazar en sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/osciloscopio;
    index index.html;

    # Ultima ventana valida escrita por oscd en tmpfs (escritura atomica)
    location = /data/window.json {
        alias /run/osciloscopio/window.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # API de control (preset / refresco) -> oscd en localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_read_timeout 2s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

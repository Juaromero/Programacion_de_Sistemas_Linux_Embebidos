<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osciloscopio · ESP32-S3 + Raspberry Pi 4</title>
<link rel="stylesheet" href="uPlot.min.css">
<style>
  :root {
    --bg: #0b1016; --panel: #121a24; --panel2: #18222f; --line: #243244;
    --fg: #e6edf5; --mut: #8696a8; --ch1: #f5b942; --ch2: #38bdf8;
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --acc: #3b82f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
           padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  header h1 small { color: var(--mut); font-weight: 400; margin-left: 6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 4px 11px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 12.5px; color: var(--mut); white-space: nowrap; }
  .pill b { color: var(--fg); font-weight: 600; }
  .pill.ok { color: var(--ok); border-color: #1f5c46; } .pill.warn { color: var(--warn); border-color: #6b5417; } .pill.bad { color: var(--bad); border-color: #6b2626; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  main { max-width: 1320px; margin: 0 auto; padding: 16px 18px 30px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .left { display: grid; gap: 14px; min-width: 0; }
  .btn { white-space: nowrap; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--mut); font-weight: 600; }
  .scope { padding: 10px 10px 4px; }
  .scope-top { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 8px; gap: 8px; flex-wrap: wrap; }
  .scope-top .meta { color: var(--mut); font-size: 12.5px; }
  #plot { background: #070b10; border-radius: 8px; border: 1px solid #1a2532; }
  .u-legend { color: var(--fg); font-size: 12.5px; padding: 6px 4px 2px; }
  .u-legend .u-marker { border-radius: 2px; }
  .u-axis { color: var(--mut); }
  .side { display: grid; gap: 14px; align-content: start; }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  button, select, input { font: inherit; color: var(--fg); }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: #3a4b62; background: #1d2938; }
  .btn.active { background: #1d3a66; border-color: var(--acc); color: #fff; }
  .btn.small { padding: 4px 8px; font-size: 12.5px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:disabled:hover { background: var(--panel2); border-color: var(--line); }
  .btn.wide { width: 100%; }
  select, input[type=number] { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
  .ch { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .ch:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .ch-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ch-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 4px; border-radius: 2px; }
  .switch { position: relative; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2a3646; border-radius: 999px; cursor: pointer; transition: .2s; }
  .switch span::after { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #cbd5e1; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--acc); }
  .switch input:checked + span::after { transform: translateX(16px); background: #fff; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row > * { flex: 1; }
  .hint { color: var(--mut); font-size: 12px; margin-top: 6px; }
  label.f { display: block; font-size: 12px; color: var(--mut); margin: 6px 0 3px; }
  .meas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 700px) { .meas { grid-template-columns: 1fr; } }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .m { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .m .k { font-size: 11.5px; color: var(--mut); }
  .m .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .advice { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: #10251c; border: 1px solid #1f5c46; color: #b7f0d6; }
  .advice.warn { background: #2a2210; border-color: #6b5417; color: #fde7a7; }
  .advice.bad { background: #2a1414; border-color: #6b2626; color: #fecaca; }
  .advice.off { background: var(--panel2); border-color: var(--line); color: var(--mut); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 4px 2px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td:last-child { text-align: right; }
  td:first-child { color: var(--mut); }
  .info p { margin: 0 0 6px; font-size: 12.5px; color: #c6d2df; }
  .info b { color: var(--fg); }
  .bottom { grid-column: 1 / -1; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 300px; }
  @media (max-width: 980px) { .bottom { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Osciloscopio de 2 canales <small>ESP32-S3 + Raspberry Pi 4</small></h1>
  <div class="pills">
    <span id="state" class="pill"><span class="dot"></span>conectando…</span>
    <span class="pill">Muestreo <b id="hFs">—</b></span>
    <span class="pill">Ventana <b id="hTw">—</b></span>
    <span class="pill">Ventana # <b id="hSeq">—</b></span>
  </div>
</header>

<main>
  <div class="left">
  <section class="card scope">
    <div class="scope-top">
      <span class="meta" id="scopeMeta">64 muestras por canal · 12 bits</span>
      <div class="row" style="margin:0; flex:0 0 auto">
        <button class="btn small" id="btnPause">Pausar</button>
        <button class="btn small" id="btnCsv">Exportar CSV</button>
      </div>
    </div>
    <div id="plot"></div>
  </section>
  <div class="meas" id="meas"></div>
  </div>

  <aside class="side">
    <section class="card">
      <h2>Frecuencia de muestreo</h2>
      <div class="seg" id="presets"></div>
      <div class="hint" id="presetHint"></div>
    </section>

    <section class="card">
      <h2>Refresco de la pantalla</h2>
      <div class="seg three" id="refresh"></div>
    </section>

    <section class="card">
      <h2>Canales</h2>
      <div id="chanCfg"></div>
    </section>

    <section class="card">
      <h2>Escala vertical</h2>
      <div class="seg">
        <button class="btn" data-y="mode">Según el modo</button>
        <button class="btn" data-y="auto">Automática</button>
      </div>
    </section>
  </aside>

  <div class="bottom">
    <section class="card info" id="fsInfo"></section>
    <section class="card">
      <h2>Enlace SPI y servicio</h2>
      <table id="stats"></table>
    </section>
  </div>
</main>

<script src="uPlot.iife.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Configuración ---------- */
  const PRESETS = [
    { id: 0, fs: 100,   label: "100 Sa/s" },
    { id: 1, fs: 1000,  label: "1 kSa/s" },
    { id: 2, fs: 10000, label: "10 kSa/s" },
    { id: 3, fs: 41667, label: "41,7 kSa/s" }
  ];
  const REFRESH = [0.25, 0.5, 1];
  /* Vin = (Vadc - offset - cal) / gain.  El ADC solo mide de 0 a ~3,1 V. */
  const MODES = {
    direct: { name: "Directo (0 a 3,1 V)", offset: 0, gain: 1, range: [-0.2, 3.4] },
    pm5:    { name: "±5 V con acondicionador", offset: 1.563, gain: 0.2632, range: [-6, 6] },
    custom: { name: "Personalizado", offset: 0, gain: 1, range: null }
  };
  const COLORS = ["#f5b942", "#38bdf8"];
  const STORE = "osc.cfg.v2";

  const $ = (id) => document.getElementById(id);
  const fmt = (v, d) => (v == null || !isFinite(v)) ? "—" : v.toFixed(d).replace(".", ",");
  const fmtV = (v) => (v == null || !isFinite(v)) ? "—" : (Math.abs(v) < 1 ? fmt(v * 1000, 0) + " mV" : fmt(v, 3) + " V");
  const fmtHz = (f) => (f == null || !isFinite(f)) ? "—" : (f >= 1000 ? fmt(f / 1000, 2) + " kHz" : fmt(f, f < 10 ? 2 : 1) + " Hz");
  const fmtFs = (fs) => fs >= 1000 ? fmt(fs / 1000, fs % 1000 ? 1 : 0) + " kSa/s" : fs + " Sa/s";
  const fmtT = (ms) => ms >= 1 ? fmt(ms, ms >= 100 ? 0 : (ms >= 10 ? 1 : 2)) + " ms" : fmt(ms * 1000, 0) + " µs";

  let cfg = {
    yMode: "mode",
    ch: [
      { show: true, mode: "direct", offset: 0, gain: 1, cal: 0 },
      { show: true, mode: "direct", offset: 0, gain: 1, cal: 0 }
    ]
  };
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.ch && s.ch.length === 2) cfg = Object.assign(cfg, s); } catch (e) { /* sin configuración guardada */ }
  const save = () => localStorage.setItem(STORE, JSON.stringify(cfg));

  let plot = null, timer = null, paused = false, last = null, lastSeq = null, refreshHz = 1, failures = 0;
  let windowMs = 640;   /* duración de la ventana: el eje de tiempo son 8 divisiones exactas */

  /* ---------- Conversión y mediciones ---------- */
  function chParams(c) {
    const ch = cfg.ch[c];
    if (ch.mode === "custom") return { offset: ch.offset, gain: ch.gain || 1 };
    return { offset: MODES[ch.mode].offset, gain: MODES[ch.mode].gain };
  }
  function toVolts(codes, vfs, c) {
    const p = chParams(c), k = vfs / 4095, cal = cfg.ch[c].cal || 0;
    return codes.map((x) => (x * k - p.offset - cal) / p.gain);
  }
  function measure(v, fs) {
    const n = v.length;
    let mn = Infinity, mx = -Infinity, s = 0, s2 = 0;
    for (const x of v) { if (x < mn) mn = x; if (x > mx) mx = x; s += x; s2 += x * x; }
    const mean = s / n, rms = Math.sqrt(s2 / n), pp = mx - mn;
    const ac = Math.sqrt(Math.max(0, s2 / n - mean * mean));
    let f = null, crossings = 0;
    if (pp > 0.05) {          /* por debajo de 50 mV pico a pico se considera ruido */
      const h = 0.1 * pp, hi = mean + h, lo = mean - h, cross = [];
      let armed = v[0] < lo;
      for (let i = 1; i < n; i++) {
        if (v[i] < lo) { armed = true; }
        else if (armed && v[i] >= hi) {
          let j = i;
          while (j > 1 && v[j - 1] >= mean) j--;
          const a = v[j - 1], b = v[j];
          cross.push((j - 1) + (b !== a ? (mean - a) / (b - a) : 0));
          armed = false;
        }
      }
      crossings = cross.length;
      if (cross.length >= 2) f = (cross.length - 1) * fs / (cross[cross.length - 1] - cross[0]);
    }
    return { mn, mx, pp, mean, rms, ac, f, crossings };
  }
  /* Ideal para ver la forma: 8 a 32 muestras por período (2 a 8 períodos en la ventana de 64). */
  function recommend(f) {
    let best = null, score = Infinity;
    for (const p of PRESETS) {
      const spp = p.fs / f;
      const sc = (spp >= 8 && spp <= 32) ? 0 : (spp < 8 ? 10 * 8 / spp : spp / 32);
      if (sc < score) { score = sc; best = p; }
    }
    return best;
  }
  function advice(m, fs, n) {
    if (m.pp < 0.05) return { cls: "off", txt: "Señal casi constante: no hay forma de onda que analizar." };
    if (m.f == null) {
      return { cls: "warn", txt: m.crossings <= 1
        ? "Menos de dos ciclos en la ventana: la señal es más lenta que la ventana. Baje la frecuencia de muestreo para ver períodos completos."
        : "No se pudo estimar la frecuencia (señal irregular o ruido)." };
    }
    const spp = fs / m.f, periods = m.f * n / fs, rec = recommend(m.f);
    const recTxt = rec && rec.fs !== fs ? " Recomendado: <b>" + rec.label + "</b>." : " La frecuencia de muestreo actual es adecuada.";
    if (spp < 4) return { cls: "bad", txt: "Solo " + fmt(spp, 1) + " muestras por período: riesgo alto de <i>aliasing</i> (la frecuencia medida puede ser falsa)." + recTxt };
    if (spp < 8) return { cls: "warn", txt: fmt(spp, 1) + " muestras por período: la forma de onda se ve aproximada." + recTxt };
    if (periods < 2) return { cls: "warn", txt: "Solo " + fmt(periods, 1) + " períodos en la ventana." + recTxt };
    return { cls: "", txt: fmt(spp, 1) + " muestras por período y " + fmt(periods, 1) + " períodos en la ventana." + recTxt };
  }

  /* ---------- Gráfica ---------- */
  function yRange(u, min, max) {
    const shown = [0, 1].filter((c) => cfg.ch[c].show);
    if (cfg.yMode === "mode" && shown.length) {
      let lo = Infinity, hi = -Infinity, fixed = true;
      for (const c of shown) {
        const r = MODES[cfg.ch[c].mode].range;
        if (!r) { fixed = false; break; }
        lo = Math.min(lo, r[0]); hi = Math.max(hi, r[1]);
      }
      if (fixed) return [lo, hi];
    }
    if (min == null || max == null || !isFinite(min)) return [-1, 1];
    const pad = Math.max((max - min) * 0.12, 0.05);
    return [min - pad, max + pad];
  }
  function zeroLine(u) {
    const y = u.valToPos(0, "y", true), b = u.bbox;
    if (y < b.top || y > b.top + b.height) return;
    const ctx = u.ctx;
    ctx.save();
    ctx.strokeStyle = "rgba(230,237,245,.45)"; ctx.lineWidth = 1; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(b.left, y); ctx.lineTo(b.left + b.width, y); ctx.stroke();
    ctx.fillStyle = "rgba(230,237,245,.6)"; ctx.font = (11 * devicePixelRatio) + "px system-ui";
    ctx.textAlign = "right";
    ctx.fillText("0 V", b.left + b.width - 6 * devicePixelRatio, y - 4 * devicePixelRatio);
    ctx.restore();
  }
  function plotHeight() { return window.innerWidth < 700 ? 300 : 430; }
  function mkPlot() {
    const el = $("plot");
    plot = new uPlot({
      width: el.clientWidth || 900,
      height: plotHeight(),
      cursor: { drag: { x: false, y: false }, points: { size: 7 } },
      legend: { live: true },
      scales: { x: { time: false, range: () => [0, windowMs] }, y: { range: yRange } },
      axes: [
        { stroke: "#8696a8", grid: { stroke: "#1b2633", width: 1 }, ticks: { stroke: "#243244" },
          splits: (u, i, min, max) => Array.from({ length: 9 }, (_, k) => min + k * (max - min) / 8),
          values: (u, t) => t.map((x) => fmtT(x)) },
        { stroke: "#8696a8", grid: { stroke: "#1b2633", width: 1 }, ticks: { stroke: "#243244" }, size: 58,
          values: (u, t) => t.map((x) => fmt(x, Math.abs(x) >= 10 ? 0 : (Math.abs(x) >= 1 ? 1 : 2)) + " V") }
      ],
      series: [
        { label: "t", value: (u, v) => v == null ? "—" : fmtT(v) },
        { label: "CH1", stroke: COLORS[0], width: 2, points: { show: false }, value: (u, v) => fmtV(v) },
        { label: "CH2", stroke: COLORS[1], width: 2, points: { show: false }, value: (u, v) => fmtV(v) }
      ],
      hooks: { draw: [zeroLine] }
    }, [[0, 1], [null, null], [null, null]], el);
    [0, 1].forEach((c) => plot.setSeries(c + 1, { show: cfg.ch[c].show }));
  }

  /* ---------- Render ---------- */
  function render(d) {
    const n = d.ch1.length, fs = d.fs, dtMs = 1000 / fs;
    const t = Array.from({ length: n }, (_, i) => i * dtMs);
    const v = [toVolts(d.ch1, d.vfs_mv / 1000, 0), toVolts(d.ch2, d.vfs_mv / 1000, 1)];
    windowMs = n * dtMs;
    plot.setData([t, v[0], v[1]]);

    $("hFs").textContent = fmtFs(fs);
    $("hTw").textContent = fmtT(n * dtMs);
    $("hSeq").textContent = d.seq;
    $("scopeMeta").textContent = n + " muestras por canal · " + d.bits + " bits · Δt = " + fmtT(dtMs) + " · 8 divisiones de " + fmtT(n * dtMs / 8);
    document.querySelectorAll("#presets .btn").forEach((b) => b.classList.toggle("active", Number(b.dataset.p) === d.preset));
    document.querySelectorAll("#refresh .btn").forEach((b) => b.classList.toggle("active", Number(b.dataset.hz) === d.refresh_hz));

    let html = "";
    for (let c = 0; c < 2; c++) {
      const m = measure(v[c], fs), a = advice(m, fs, n), ch = cfg.ch[c];
      html += '<section class="card"><h2 style="display:flex;justify-content:space-between">' +
        '<span><span class="swatch" style="display:inline-block;background:' + COLORS[c] + ';margin-right:8px;vertical-align:3px"></span>CH' + (c + 1) +
        ' · GPIO' + (c + 1) + '</span><span style="text-transform:none;letter-spacing:0">' + MODES[ch.mode].name + (ch.cal ? " · calibrado" : "") + '</span></h2>' +
        '<div class="mgrid">' +
        cell("Mínimo", fmtV(m.mn)) + cell("Máximo", fmtV(m.mx)) + cell("Pico a pico", fmtV(m.pp)) +
        cell("Media", fmtV(m.mean)) + cell("RMS (AC)", fmtV(m.ac)) + cell("Frecuencia", fmtHz(m.f)) +
        '</div><div class="advice ' + a.cls + '">' + a.txt + '</div></section>';
    }
    $("meas").innerHTML = html;

    const s = d.stats;
    const rows = [
      ["Ventanas recibidas", s.windows], ["Ventanas no leídas", s.lost], ["Errores de CRC", s.crc_err],
      ["Errores de sincronía", s.sync_err], ["Reinicios del ESP32-S3", s.esp_resets != null ? s.esp_resets : "—"],
      ["Reloj SPI", (s.spi_hz / 1e6).toFixed(1).replace(".", ",") + " MHz"],
      ["Tiempo por transacción", fmt(s.seg_avg_us, 1) + " µs"]
    ];
    $("stats").innerHTML = rows.map((r) => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("");
    renderFsInfo(fs, n);
  }
  function cell(k, v) { return '<div class="m"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>"; }
  function renderFsInfo(fs, n) {
    const tw = n / fs * 1000;
    $("fsInfo").innerHTML = "<h2>¿Qué señales se ven bien a " + fmtFs(fs) + "?</h2>" +
      "<p>Límite teórico (Nyquist): señales de hasta <b>" + fmtHz(fs / 2) + "</b>. Por encima aparece <i>aliasing</i>: una frecuencia falsa.</p>" +
      "<p>Para ver bien la <b>forma</b> de la onda: 8 a 32 muestras por período, es decir entre <b>" + fmtHz(fs / 32) + "</b> y <b>" + fmtHz(fs / 8) + "</b> (2 a 8 períodos en la ventana de " + fmtT(tw) + ").</p>" +
      "<p>Tasas disponibles: " + PRESETS.map((p) => p.label + " → hasta " + fmtHz(p.fs / 8)).join(" · ") + ".</p>" +
      "<p style='color:var(--mut)'>El ESP32-S3 no tiene filtro antialiasing: si la frecuencia medida cambia al subir la tasa de muestreo, la anterior era un alias.</p>";
  }

  /* ---------- Controles ---------- */
  function buildControls() {
    $("presets").innerHTML = PRESETS.map((p) => '<button class="btn" data-p="' + p.id + '">' + p.label + "</button>").join("");
    $("refresh").innerHTML = REFRESH.map((hz) => '<button class="btn" data-hz="' + hz + '">' + String(hz).replace(".", ",") + " Hz</button>").join("");
    $("presetHint").textContent = "Ventana de 64 muestras por canal; el cambio se aplica en la ventana siguiente.";
    document.querySelectorAll("#presets .btn").forEach((b) => b.addEventListener("click", () => post("/api/preset?id=" + b.dataset.p)));
    document.querySelectorAll("#refresh .btn").forEach((b) => b.addEventListener("click", async () => {
      await post("/api/refresh?hz=" + b.dataset.hz); refreshHz = Number(b.dataset.hz); schedule(); poll();
    }));
    document.querySelectorAll("[data-y]").forEach((b) => b.addEventListener("click", () => {
      cfg.yMode = b.dataset.y; save(); syncY(); if (last) render(last);
    }));
    syncY();
    buildChannels();
    $("btnPause").addEventListener("click", () => {
      paused = !paused; $("btnPause").textContent = paused ? "Reanudar" : "Pausar";
      $("btnPause").classList.toggle("active", paused); if (!paused) poll(); setStatus();
    });
    $("btnCsv").addEventListener("click", exportCsv);
  }
  function syncY() { document.querySelectorAll("[data-y]").forEach((b) => b.classList.toggle("active", b.dataset.y === cfg.yMode)); }
  function buildChannels() {
    let h = "";
    for (let c = 0; c < 2; c++) {
      const ch = cfg.ch[c];
      h += '<div class="ch"><div class="ch-head"><span class="ch-name"><span class="swatch" style="background:' + COLORS[c] + '"></span>CH' + (c + 1) +
        ' <span style="color:var(--mut);font-weight:400">GPIO' + (c + 1) + '</span></span>' +
        '<label class="switch"><input type="checkbox" data-show="' + c + '"' + (ch.show ? " checked" : "") + "><span></span></label></div>" +
        '<select data-mode="' + c + '">' + Object.keys(MODES).map((k) => '<option value="' + k + '"' + (k === ch.mode ? " selected" : "") + ">" + MODES[k].name + "</option>").join("") + "</select>" +
        (ch.mode === "custom"
          ? '<div class="row"><div><label class="f">Desplazamiento (V)</label><input type="number" step="0.001" data-off="' + c + '" value="' + ch.offset + '"></div>' +
            '<div><label class="f">Ganancia</label><input type="number" step="0.0001" data-gain="' + c + '" value="' + ch.gain + '"></div></div>'
          : "") +
        '<div class="row"><button class="btn small" data-zero="' + c + '">Calibrar cero</button>' +
        '<button class="btn small" data-unzero="' + c + '"' + (ch.cal ? "" : " disabled") + ">Quitar calibración</button></div></div>";
    }
    h += '<div class="hint">El ADC solo mide de 0 a 3,1 V. Para tensiones negativas use el acondicionador (±5 V) y luego «Calibrar cero» con la entrada a GND.</div>';
    $("chanCfg").innerHTML = h;
    document.querySelectorAll("[data-show]").forEach((e) => e.addEventListener("change", () => {
      const c = Number(e.dataset.show); cfg.ch[c].show = e.checked; save(); plot.setSeries(c + 1, { show: e.checked }); if (last) render(last);
    }));
    document.querySelectorAll("[data-mode]").forEach((e) => e.addEventListener("change", () => {
      const c = Number(e.dataset.mode); cfg.ch[c].mode = e.value; cfg.ch[c].cal = 0; save(); buildChannels(); if (last) render(last);
    }));
    document.querySelectorAll("[data-off],[data-gain]").forEach((e) => e.addEventListener("change", () => {
      const c = Number(e.dataset.off != null ? e.dataset.off : e.dataset.gain), val = parseFloat(String(e.value).replace(",", "."));
      if (!isFinite(val) || (e.dataset.gain != null && val === 0)) return;
      if (e.dataset.off != null) cfg.ch[c].offset = val; else cfg.ch[c].gain = val;
      save(); if (last) render(last);
    }));
    document.querySelectorAll("[data-zero]").forEach((e) => e.addEventListener("click", () => {
      if (!last) return;
      const c = Number(e.dataset.zero), codes = c === 0 ? last.ch1 : last.ch2, p = chParams(c);
      const meanAdc = codes.reduce((a, b) => a + b, 0) / codes.length * (last.vfs_mv / 1000) / 4095;
      cfg.ch[c].cal = meanAdc - p.offset; save(); buildChannels(); render(last);
    }));
    document.querySelectorAll("[data-unzero]").forEach((e) => e.addEventListener("click", () => {
      const c = Number(e.dataset.unzero); cfg.ch[c].cal = 0; save(); buildChannels(); if (last) render(last);
    }));
  }
  function exportCsv() {
    if (!last) return;
    const v1 = toVolts(last.ch1, last.vfs_mv / 1000, 0), v2 = toVolts(last.ch2, last.vfs_mv / 1000, 1);
    let csv = "t_ms,ch1_V,ch2_V,ch1_codigo,ch2_codigo\n";
    for (let i = 0; i < last.ch1.length; i++) {
      csv += (i * 1000 / last.fs).toFixed(4) + "," + v1[i].toFixed(4) + "," + v2[i].toFixed(4) + "," + last.ch1[i] + "," + last.ch2[i] + "\n";
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "ventana_" + last.seq + "_" + last.fs + "Sa.csv";
    a.click(); URL.revokeObjectURL(a.href);
  }

  /* ---------- Comunicación ---------- */
  function setStatus(kind) {
    const e = $("state");
    if (paused) { e.className = "pill warn"; e.innerHTML = '<span class="dot"></span>en pausa'; return; }
    if (kind === "live") { e.className = "pill ok"; e.innerHTML = '<span class="dot"></span>en vivo'; }
    else if (kind === "stale") { e.className = "pill warn"; e.innerHTML = '<span class="dot"></span>sin ventana nueva'; }
    else if (kind === "err") { e.className = "pill bad"; e.innerHTML = '<span class="dot"></span>sin datos'; }
  }
  async function poll() {
    if (paused) return;
    try {
      const r = await fetch("/data/window.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      failures = 0;
      setStatus(d.seq === lastSeq ? "stale" : "live");
      lastSeq = d.seq; last = d;
      render(d);
      if (Math.abs(d.refresh_hz - refreshHz) > 1e-6) { refreshHz = d.refresh_hz; schedule(); }
    } catch (e) {
      if (++failures >= 2) setStatus("err");
    }
  }
  function schedule() { if (timer) clearInterval(timer); timer = setInterval(poll, 1000 / refreshHz); }
  async function post(url) {
    try { const r = await fetch(url, { method: "POST" }); if (!r.ok) throw new Error(); }
    catch (e) { setStatus("err"); }
  }

  window.addEventListener("resize", () => plot && plot.setSize({ width: $("plot").clientWidth, height: plotHeight() }));
  buildControls();
  mkPlot();
  renderFsInfo(100, 64);
  poll();
  schedule();
})();
</script>
</body>
</html>
